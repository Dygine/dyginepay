<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in &middot; Dygine Pay</title>
<style>
body{font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
 background:#09090b;color:#111;display:flex;align-items:center;
 justify-content:center;min-height:100vh;margin:0}
.box{background:#fff;border-radius:12px;padding:32px;width:340px}
h1{font-size:19px;margin:0 0 4px;letter-spacing:-.02em}
h1 span{color:#0d9488}
p.sub{color:#6e6e78;font-size:13px;margin:0 0 20px}
label{display:block;font-size:12px;color:#6e6e78;margin:12px 0 4px}
input{width:100%;padding:9px 11px;border:1px solid #e6e6ea;border-radius:7px;
 font:inherit;font-size:13px;box-sizing:border-box}
button{width:100%;background:#0d9488;color:#fff;border:none;border-radius:7px;
 padding:10px;font:inherit;font-weight:500;margin-top:18px;cursor:pointer}
.err{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;padding:9px 11px;
 border-radius:7px;font-size:12.5px;margin-bottom:14px}
</style></head>
<body>
<form class="box" method="post" action="/admin/login">
  <h1>Dygine<span>Pay</span></h1>
  <p class="sub">{{ business }}</p>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <label>Email</label>
  <input type="email" name="email" required autofocus autocomplete="username">
  <label>Password</label>
  <input type="password" name="password" required autocomplete="current-password">
  <button type="submit">Sign in</button>
</form>
</body></html>
