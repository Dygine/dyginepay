<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Link not available &middot; {{ business }}</title>
<style>
body{font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
 background:#f4f4f6;display:flex;align-items:center;justify-content:center;
 min-height:100vh;margin:0;padding:20px;color:#111114}
.box{background:#fff;border-radius:14px;padding:34px 28px;max-width:370px;
 width:100%;text-align:center;box-shadow:0 12px 32px rgba(0,0,0,.06)}
h1{font-size:18px;margin:0 0 8px;letter-spacing:-.02em}
p{color:#6e6e78;font-size:14px;margin:0}

<body><div class="box">
  <h1>{{ message }}</h1>
  <p>Ask {{ business }} for a new payment link if you still need to pay.</p>
</div></body></html>
